name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with: {enable-cache: true}
      - run: uv python install 3.12
      - uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: 0.16.9
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: make bootstrap
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Integration and regression tests
        run: uv run --no-editable python scripts/run_pytest_ci.py tests/integration tests/regression
      - name: Unit tests
        run: uv run --no-editable pytest tests/unit
      - name: Audit Agent Operations
        run: make audit-agent-ops
      - name: Validate claims and run manifests
        run: make validate-claims
      - name: Validate deterministic offline compendium candidate
        run: make compendium-release-readiness VERSION=0.1.0
