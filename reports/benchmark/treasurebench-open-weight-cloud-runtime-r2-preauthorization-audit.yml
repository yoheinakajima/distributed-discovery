limitations:
  - RunPod remains the infrastructure provider and may observe or misreport host-level facts; this runtime is not physically local or fully infrastructure independent.
  - Control-plane container identity plus measured in-container facts do not make the provider cryptographically unable to substitute infrastructure.
  - The current documented PodFindAndDeployOnDemand input exposes terminateAfter but not volumeEncrypted; R2 therefore requires both the authenticated create response and the Pod-scoped self-query to report volumeEncrypted true before any secret is written. False or absent is an exact bounded control-boundary failure, not permission to send an undocumented field.
  - Exact post-termination volume deletion is inferred only from the selected disposable non-network Pod volume semantics and exact Pod absence; any provider ambiguity hard-stops closeout.
