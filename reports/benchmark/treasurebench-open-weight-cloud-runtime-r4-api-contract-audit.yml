corrected_design_decisions:
- R3 GraphQL Pod create is replaced, not supplemented, by one exact REST Pod create; GraphQL Pod create is prohibited.
- volumeEncrypted true is requested at create time and measured again in both returned create state and a fresh GET.
- terminateAfter is removed from the create body; the design accurately states controller finalizer plus Pod-resident watchdog rather than a native server-side termination guarantee.
- The endpoint bearer moves from /workspace to a mode-0600 /run file so the encrypted public-artifact volume contains no credential.
- The live GitHub preflight uses no gh command and no GitHub token.
failed_validation_or_observation_attempts:
- The direct web-page opener rejected the raw GitHub API URL under its safety filter; fixed public curl requests with the registered User-Agent and normalized jq projection verified the same read-only state without retaining raw bodies.
- The local ripgrep executable was unavailable during the initial R4 source scan; the read-only scan was repeated with grep and found the expected copied R2/R3 strings before correction.
- Initial focused validation stopped on one unused import, then one unimportable scripts-package test path, then one overbroad gh substring assertion; each was corrected and the 62-test R4 suite passed.
- Initial strict mypy found ten explicit narrowing and test-wrapper typing errors; the typed correction passed strict focused mypy without semantic change.
- Initial sandboxed make verify reached 995 passing tests with six nested uv previews failing only on blocked DNS; the network-enabled rerun passed all 1001 tests and the complete audit wall.
- An explicit make papers command was unavailable because the host lacks pdfinfo; paper invariant tests passed in the complete test wall and make site passed independently.
limitations:
- The watchdog is an owner-controlled in-Pod process, not a provider-native terminateAfter guarantee; host or provider failure can defeat it, while the independent controller finalizer remains the primary deletion control.
- RunPod necessarily sees authenticated control-plane traffic and supplies the host; AO-0012 does not claim cryptographic infrastructure independence, legal nonretention, or provider inability to inspect or misreport its own infrastructure.
- The public GitHub surfaces are live network dependencies and may be unavailable; any failure occurs before repository credential ingress.
