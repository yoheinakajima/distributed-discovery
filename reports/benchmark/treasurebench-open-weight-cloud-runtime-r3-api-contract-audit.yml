limitations:
- The GraphQL schema exposes minCudaVersion as an available field, but R3 deliberately freezes the current guide's exact allowedCudaVersions list and rejects minCudaVersion; no claim is made that the schema field is nonexistent.
- Secrets sent to secretCreate necessarily transit the authenticated GraphQL request; R3 controls redaction, lifetime, provider configuration, and deletion but does not claim the infrastructure provider cannot observe its own control plane.
- R3 does not change the accepted R2 volume-encryption observation limitation, infrastructure trust boundary, runtime identity, or scientific boundary.
