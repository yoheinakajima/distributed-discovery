engine_container_audit:
  official_model_specific_recipe: Mistral tokenizer/config/load modes with vLLM; tool parser flags apply only when tools are used
  selected_text_only_deviation: tools and automatic tool choice disabled because TreasureBench uses a repository action JSON schema and no tools
  vllm_release_commit: 91df0fad4dc98a67c7659d9dbd915245d5c43d96
  linux_amd64_digest: sha256:3a1e7f5904e1a1192a02aa0086ceaffc33985d7044c7bb25b3a43d61bdbe3ac0
  image_size_bytes: 9190790035
  python: "3.12"
  cuda: "13.0.2"
  cuda_arch_includes_a100_sm80: true
  runpod_allowed_cuda_version: "13.0"
  minimum_linux_driver_version: "580.65.06"
  accepted_driver_branches: ["580", "595", "610"]
  driver_identity: must be checked before model download and recorded; NVIDIA's CUDA 13.0 table requires Linux driver 580.65.06 or newer, so every 535 through 575 host is rejected
  recreate_elsewhere: same amd64 image digest, A100 80GB, exact artifact checksums, manifest, startup, and proxy
runpod_audit:
  product: Secure Cloud Pod
  rental: dedicated-on-demand-noninterruptible
  gpu_type_id: NVIDIA A100 80GB PCIe
  availability: public GPU list indicates the exact type; authenticated live stock must be rechecked only after authorization
  price_usd_per_gpu_hour: "1.39"
  price_observed_at: "2026-07-30"
  six_hour_compute_usd: "8.34"
  expected_total_under_usd: "10"
  conservative_planning_envelope_usd: "10"
  hard_total_cap_usd: "20"
  billing: per-second Pod billing subject to account credit minimums
  api: REST /v1/pods supports SECURE cloud, exact GPU IDs/count, allowed CUDA versions, region restrictions, image, entrypoint, start command, environment, ports, disks, and desired status
  storage:
    container_disk: temporary and cleared on stop/restart
    volume_disk: mounted at /workspace, survives stop, deleted with Pod termination
    selected: 120 GB encrypted volume disk plus 50 GB container disk
    network_volume: not selected
  network:
    selected: RunPod HTTPS proxy to one bearer-authenticated application port
    caveat: the HTTP proxy route is public once exposed; the Pod ID is not an authentication control
    raw_prompt_output_logging: prohibited at owner proxy and vLLM
  logs:
    provider_system_lifecycle_logs: exist
    prompt_or_raw_output_in_public_logs: prohibited-by-application
    provider_wide_nonretention_claim: not-made
  lifecycle:
    create: POST exact manifest with desired RUNNING
    startup: reconstruct scripts from committed bytes, verify identity and checksums, load exact model, emit authenticated attestation, expose endpoint
    normal_finish: terminate Pod immediately
    timeout: terminate at or before six hours
    teardown_verification: after DELETE the exact Pod ID must become unaddressable before billing reconciliation; otherwise fail closed and require owner intervention
    billing_verification: sum only billing records for the exact created Pod ID and require positive billed milliseconds and amount after teardown
    stopped_persistence: prohibited
    retained_network_volume: none
controls_and_limits:
  passes_definition_prospectively: true
  requires_live_attestation: true
  requires_public_calibration: true
  physical_locality: false
  full_infrastructure_independence: false
  legal_security_privacy_conclusion: none
  provider_adversary_resistance_claim: none
