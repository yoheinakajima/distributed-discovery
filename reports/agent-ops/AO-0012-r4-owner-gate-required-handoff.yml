decision: >-
  Stop exactly once at owner-gate-required. Public pre-ingress uses bounded,
  token-free GitHub issue/PR GETs with a fixed User-Agent plus exact git
  ls-remote, never gh. After exact R4 authorization only, repository-root
  .env.txt may return exactly RUNPOD_API_KEY and HF_TOKEN. GraphQL inventory and
  temporary Secret operations use the URL-encoded api_key query only; REST
  template, Pod create/get/delete, and billing operations use Bearer only. The
  one encrypted REST Pod create freezes exactly name, cloudType SECURE,
  computeType GPU, gpuTypeIds [NVIDIA A100 80GB PCIe], gpuTypePriority
  availability, gpuCount 1, allowedCudaVersions [13.0], templateId,
  containerDiskInGb 50, volumeInGb 120, volumeMountPath /workspace,
  volumeEncrypted true, countryCodes [US], ports [8000/http], and
  supportPublicIp false. Three short-lived Secrets and one private template are
  deleted and verified. The controller finalizer and a Pod-resident six-hour
  exact-self-delete watchdog bound orphan risk. Measured attestation covers
  actual GPU name/count/memory, driver, requested CUDA class, toolkit/runtime,
  PyTorch CUDA, vLLM 0.23.0, mistral-common >=1.11.3, exact model/tokenizer
  hashes, no quantization/sharding, startup/load, peak memory, and watchdog
  identity/deadline. Success and every bounded failure delete and verify the Pod,
  encrypted disposable volume, Secrets, and template, then reconcile exact
  positive Pod billing plus returned storage charges. Any resource or billing
  ambiguity keeps PR #213 and issue #212 open. Expected spend is under USD 10,
  conservative planning is USD 10, and hard caps are USD 20, six GPU-hours, and
  400 calls.
