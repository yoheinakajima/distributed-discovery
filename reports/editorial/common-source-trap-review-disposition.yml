    severity: minor-mathematical-wording
    manuscript_location: Section 9
    finding: An open subsidy interval has no smallest element, and inducing at least one purchase is not the same as inducing exactly one.
    disposition: accept-with-edit
    canonical_evidence: [Theorem-1, thresholds-A0-A1]
