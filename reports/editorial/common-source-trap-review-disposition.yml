    edit: Retain and sharpen conditional novelty language; do not claim that the primary-source abstract records establish theorem equivalence or non-equivalence.
    validation: Citation audit uses only existing manuscript citations; no reviewer-supplied citation is imported without a repository bibliography record.
  - finding_id: CST-R1-M02
