    manuscript_location: Section 6 and Appendix A.2
    finding: The proof did not explicitly connect the coupled kernel to A_k minus A_{k+1}, state the m-domain, separate the endpoint, or offer a smallest-team check.
    disposition: accept-with-edit
    canonical_evidence: [DD-C-0057, equation-ak, equation-positive-kernel]
    edit: Add the exact expectation identity, m=N-k at least 2, the separate A_{N-1}=0 endpoint, the N=2 hand check, and an intuition sentence.
    validation: Native analytic and corruption tests plus a deterministic paper build.
  - finding_id: CST-R1-M03
