    source_refs: [chatgpt-unsupported-1-through-7, claude-unsupported-1, claude-unsupported-3]
    severity: major
    manuscript_location: Abstract; Sections 1, 2.4, 7.1, 9, 11, 12, and 14
    finding: Several phrases overstated generality, net discovery, mechanism exclusivity, architectural strength, artifact generation, readiness, or prevention.
    disposition: accept-with-edit
    canonical_evidence: [DD-C-0052, DD-C-0054, DD-C-0056, DD-C-0057, DD-C-0058]
    edit: Use net social value, all-finite-N homogeneous-model scope, conditional novelty, driven-by wording, direct-control wording, bounded-atlas visibility, candidate-package wording, and an all-common boundary.
