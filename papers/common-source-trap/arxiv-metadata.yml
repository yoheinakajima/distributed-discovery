title: "The Common-Source Trap: Endogenous Independent Evidence in Distributed Discovery"
authors: [Yohei Nakajima]
affiliation: Untapped Capital
abstract: >-
  When several searchers can use a free common signal or purchase independent
  signals, the group may remain concentrated on the common source even though
  one independent source raises net social value. This paper studies that
  wedge in a finite, exact source-choice model. For arbitrary finite team size
  N at least 2, it derives each common-to-independent payoff threshold, proves
  that the thresholds are strictly decreasing, and characterizes every weak
  pure source-count equilibrium. The planner thresholds are also explicit. At
  the all-common boundary, an equilibrium/planner wedge exists exactly for
  p(1-p)(N-1)/N <= c < p(1-p), an interval of width p(1-p)/N. Exact
  enumeration for N=2,...,8 reproduces the formulas. The result is not a
  universal under-acquisition theorem: at N=3, p=4/5, and c=13/375, the unique
  equilibrium purchases two independent sources while the planner purchases
  one. The paper uses that counterexample to separate source diversity, action
  diversity, disclosure, and rewards. It relates the theorem to bounded
  mechanism and architecture results and states experimental predictions
  without claiming human evidence. Its finite grids and analytic curves are
  generated from checksum-validated immutable artifacts; companion figures
  reproduce separately registered, non-nested models.
