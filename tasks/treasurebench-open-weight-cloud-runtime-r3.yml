- Stop with exact-bf16-runtime-infeasible-quantized-or-sharded-identity-gate-required if official or measured evidence shows the exact BF16 model cannot run on one A100 80GB under the pinned engine.
- Stop with self-operated-control-boundary-failed-managed-api-rejected if the owner cannot control and verify the actual weights serving stack endpoint and retention boundary.
- Stop exactly once at owner-gate-required before any credential access authenticated RunPod or Hugging Face API model download provisioning endpoint launch calibration or spend.
