expected_outcomes:
- A versioned machine-readable open-weight runtime definition separating physical locality, model and serving-stack control, provider independence, and infrastructure independence.
- A current official-source feasibility audit for the exact model revision, BF16 weights, pinned engine and container, CUDA and driver compatibility, one A100 80GB, and RunPod Secure Cloud Pod controls and price.
- An authorization-free fail-closed deployment and conformance package with synthetic corruption coverage and no credential or model download.
- One frozen ten-task five-architecture one-repeat public calibration design with 50 intended pairings and predeclared acceptance.
- One exact generic owner gate and schema-valid owner-gate-required handoff.
- After a later authorized calibration only, one permitted final decision and the next-task candidate if warranted.
