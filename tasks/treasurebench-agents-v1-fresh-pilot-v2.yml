  actions:
    - Register one private-evaluation issue, branch, fixed contract, living ExecPlan, and draft pull request as AO-0006.
    - Audit current official provider routes, exact models, structured outputs, request parameters, retention, retries, errors, and prices.
    - Freeze new v2 campaign and batch identities, a public 50-slot allocation recipe, exact execution graph, expected and conservative costs, caps, and versioned schemas without generating private material.
    - Implement versioned v2 custody, execution, provider-schema, semantic-validation, verification, redaction, output-lock, and fail-closed budget boundaries offline.
    - Run the complete 50-task and 500-run synthetic rehearsal and every registered corruption with zero credentials, private generation, provider calls, or spend.
    - Freeze the exact execution commit and commit one generic Agent Operations owner-gate manifest.
non_goals:
  - No DD-023, claim, scientific run, proof, evidence-status change, or paper result.
  - No ranking, composite, leaderboard, package, release, DOI, arXiv, journal, or submission action.
  - No base campaign, local or open-model campaign, OpenRouter route, fallback route, alias, regional route, batch route, or model substitution.
  - No reuse, retry, reopening, mutation, rescoring, deletion, unsealing, reactivation, or reauthorization of either quarantined campaign or any AO-0002 through AO-0005 artifact.
  - No credential read, prior private-state read, real seed or private-material generation, custody creation, provider call, or spend before the exact owner authorization.
