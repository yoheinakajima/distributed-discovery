owner_decisions:
  - The selected gate is one wholly fresh 50-task and 500-run sealed repair-confirmation engineering pilot.
  - The pilot uses ten new tasks from each of five registered task families, five registered architectures, direct OpenAI and direct Anthropic routes, and one repeat.
  - The campaign, batch, OS-CSPRNG seed, tasks, answers, task and answer keys, nonces, ciphertexts, commitments, access log, ledgers, traces, output lock, and custody must all be new.
  - Both quarantined campaigns and every AO-0002 through AO-0005 gate, authorization, ledger, output lock, custody object, and terminal decision remain immutable and receive no authority from this task.
  - AO-0004 R4 provider-specific OpenAI and Anthropic schema conformance and provider-independent exactly-one-final-action conformance are engineering-only prerequisites, not scientific evidence.
  - Provider calls, credentials, private generation, custody creation, unsealing, and spend require the exact committed generic Agent Operations owner gate.
  - The fresh expected cost is USD 11.51, the conservative planning cost is USD 15, and the unchanged owner ceilings are USD 25 total, USD 10 OpenAI, USD 15 Anthropic, and 5,200 calls.
