expected_outcomes:
  - A current-provider, wholly fresh, repaired 50-task and 500-run sealed engineering pilot execution surface.
  - Passing provider-schema, action-budget, custody, trace, output-lock, independent-verification, contamination, redaction, budget, and complete synthetic-rehearsal acceptance.
  - A committed exact generic owner-gate manifest and schema-valid owner-gate-required handoff before consequential action.
stop_conditions:
  - Stop before reading .env.txt or any prior private campaign state, creating the real seed or custody, making a provider call, or spending money without the exact active owner authorization.
  - Stop if campaign, batch, seed, task, answer, key, nonce, ciphertext, commitment, ledger, trace, custody, output-lock, quarantined-pilot, future-base, or base-campaign identity separation fails.
  - Stop if any provider route, exact model, structured-output contract, request parameter, retention term, retry policy, price, token ceiling, call ceiling, cost cap, or authorization surface is unresolved.
  - Stop if any terminal provider failure, protocol-invalid run, invalid final-action cardinality, incomplete pairing, Method A/B disagreement, Method C failure, contamination finding, metric-range error, corruption acceptance, identity mismatch, or output-lock failure occurs.
  - Stop if scientific inventories, paper artifacts, release state, public private-data boundaries, immutable AO history, or unrelated preservation files change.
