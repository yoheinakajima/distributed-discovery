owner_decisions:
  - On 2026-08-07, the owner activated the milestone-bounded paper-review standing authorization, recorded in the owner-managed source at commit 6b5a089; this additive contract records its Common-Source Trap subset without copying credentials or owner-private state into the repository.
  - The missing ChatGPT review may be replaced by exactly one fresh headless OpenAI Responses API review using the strongest supported non-top-tier model permitted by the frozen Round 2 packet, with deterministic preflight, private receipt capture, no tools, and no retry after any delivery ambiguity.
  - If and only if the replacement qualifies, one fresh Anthropic review and one fresh Google review may complete the other missing named reviewer slots under the same packet, independence, receipt, and no-retry requirements.
  - Existing credentials may be read only through the exact, project-restricted Keychain ingress after all local checks pass. Credential creation, rotation, enumeration, display, logging, persistence, and repository inclusion remain prohibited.
  - Once all four qualifying independent reviews are available as one provenance-bound bundle, one synthesis, one writer handoff, one bounded evidence-bound revision, deterministic rebuild and validation, and draft-PR update are authorized. Merge, undraft, release, deployment, and publication remain owner gates.
scope:
  paths:
    - tasks/common-source-trap-round2-standing-review-completion-r3.yml
    - reports/agent-ops/AO-0014-standing-paper-review-authorization.yml
    - plans/COMMON_SOURCE_TRAP_INDEPENDENT_REVIEW.md
    - plans/MASTER_EXEC_PLAN.md
    - reports/editorial/common-source-trap-round2-review-packet.yml
    - src/distributed_discovery/editorial_review.py
    - tests/unit/test_common_source_trap_headless_review.py
  actions:
    - Build and test a deterministic, headless OpenAI replacement-review wrapper with a strict closed response schema, frozen-artifact validation, page-coverage validation, private mode-0600 receipts, and redacted terminal outcomes.
    - Use only an existing exact Keychain credential after local preflight; stop without provider contact if it is absent, unsafe, or mismatched.
    - Make at most one successful request for each missing named reviewer, preserve every nonqualifying outcome, and never retry after provider delivery may have occurred.
    - After a complete qualifying bundle, synthesize once, hand the full bundle to the writer once, make one evidence-bound revision, rebuild deterministically, validate, and update only draft PR 221.
non_goals:
  - No credential creation, rotation, enumeration, display, logging, persistence, or repository inclusion.
  - No reuse of the missing-receipt ChatGPT review, the excluded Claude UI review, the ambiguous Gemini attempt, or any Round 1 session or reviewer output.
  - No cross-provider substitution, browser review session, tool, connector, retry, continuation, provider fallback, or unbounded provider operation.
  - No new study, claim, proof, run, evidence-status change, lifecycle-status change, scientific execution, Information Sharing Frontier work, or action on protected unrelated worktree entries.
  - No PR readiness, merge, issue closure, publication, deployment, Explore Science upload, DOI, release, submission, branch deletion, or provider spend above the standing caps.
permissions:
  repository_write: true
  git_branch_commit: true
  github_issue_pr: true
