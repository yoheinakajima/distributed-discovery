  spend: true
  release_publication: false
  submission: false
scientific_mutation_permissions:
  create_study: false
  create_claim: false
  create_run: false
  change_evidence_status: false
  change_proof_status: false
  change_paper_lifecycle: false
private_data_permissions: {read: true, write: true, generate: true, publish: false}
budget:
  currency: USD
  expected: "0.60"
  hard_cap: "3.00"
  call_cap: 3
  category_caps:
    openai_chatgpt_replacement: "1.00"
    anthropic_claude_replacement: "1.00"
    google_gemini_replacement: "1.00"
  cumulative_spend: "0"
expected_outcomes:
  - One independently reproducible, private, closed-schema OpenAI replacement receipt or an honest local/provider failure receipt with no retry.
  - At most three new bounded provider calls, each below USD 1, with aggregate new paper-review-lane spend below USD 10 when reconciled with preserved receipts.
  - A complete four-review provenance-bound Round 2 bundle before any editorial revision.
  - One evidence-bound revision candidate in existing draft PR 221, with deterministic rebuild and validation, stopped before merge or publication.
stop_conditions:
  - Stop before provider contact if the exact frozen packet, manuscript, PDF, page count, response schema, local preflight, credential ingress, existing-spend bound, or provider/model/cost bound does not pass.
  - Stop after every ambiguous provider delivery, malformed or incomplete response, missing receipt, schema mismatch, page-coverage failure, cap breach, provider/model drift, or unsafe retention observation; do not retry or substitute.
  - Stop if the exact existing Keychain credential is absent. The owner must perform credential setup separately; this task may not create or change credentials.
  - Stop before merge, PR readiness, issue closure, deployment, publication, Explore Science, release, submission, DOI, branch deletion, new research, or Information Sharing Frontier work.
