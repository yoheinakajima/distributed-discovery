owner_decisions:
  - Register AO-0010 as the sole substantive lane for the prospective TreasureBench Agents v1 protocol-validity policy v2 and wholly fresh sealed repair-confirmation pilot v4; no separate policy task is required.
  - Preserve AO-0008 campaign treasurebench-agents-v1-repair-confirmation-v3, batch tb-agents-v1-repair-confirmation-v3-b01, execution commit 0f9d82bb50cbb334bea47e24448831faf0cdbed8, decision fresh-pilot-v3-quarantined-engineering-only, output lock sha256:e52055b08ca3a8acb1cfb6ac608c6e601f3c618352900f92bf91c5ffc4718dbb, 3576 retained objects, and permanently closed private-read authority without reopening, unsealing, rerunning, reusing, rescoring, splicing, mutating, deleting, or reauthorizing it or any prior campaign.
  - Treat AO-0008's 3067 attempts, 3016 completed logical calls, 51 recovered attempts, zero terminal provider attempts, 500 pairing records, 32 protocol-nonconforming traces, and 32 parse/schema-repair-exhaustion traces only as retained engineering planning observations, never scientific or performance evidence.
  - Freeze one prospective forward-only policy version that separates batch-integrity-valid, provider-terminal-missing, protocol-valid, and protocol-invalid without rewriting historical policies or schemas.
  - Classify a completed provider response that remains nonconforming after exactly one registered schema-only repair as protocol-invalid evaluated-system behavior, not by itself a batch-integrity failure.
  - Preserve every protocol-invalid terminal trace and safe classification, retain every invalid pairing in the denominator, prohibit replacement and rerun, parse or credit no invalid action, construct no substitute portfolio, and report protocol conformance separately.
  - Compute exact metrics only where the registered metric is defined from valid protocol output; register metric-specific feasible bounds for invalid pairings and architecture-contrast bounds over all intended pairings. Any valid-output-conditional estimate is secondary and selection-conditioned; no complete-case result may be presented as an unconditional architecture effect.
  - Preserve at most two transport attempts under the existing bounded retry classes, exactly one schema-only repair, zero semantic-answer retries, zero silent normalization, zero invalid-output credit, exactly-one-final-action semantics, and Method C before performance interpretation.
  - Permit protocol-invalid traces without whole-batch quarantine only when every intended pairing has exactly one unique terminal protocol classification and all provider, identity, correspondence, custody, cap, lock, contamination, verification, bounds, redaction, and retained-state acceptance conditions pass.
  - Quarantine the whole batch for terminal provider failure, missing or duplicate pairing, response/ledger or trace/inventory integrity failure, contamination, cap breach, execution identity mismatch, output-lock failure, unseal before lock, Method implementation disagreement, independent bounds disagreement, or unsafe retained state.
  - Freeze campaign treasurebench-agents-v1-repair-confirmation-v4 and batch tb-agents-v1-repair-confirmation-v4-b01 after collision checks; allocate every seed, task, answer, key, nonce, ciphertext, commitment, log, ledger, response, trace, custody, lock, and audit identity wholly fresh only after authorization.
  - Freeze 50 private tasks, ten from each registered family, five registered architectures, direct OpenAI gpt-5.4-2026-03-05, direct Anthropic claude-sonnet-4-6, one repeat, 500 intended pairings, the exact passing provider-specific schemas, and 256 output tokens per request.
  - Preserve the v3 prompt and action contract unchanged except for strictly necessary prospective policy integration; prohibit prompt tuning against the 32 retained AO-0008 failures.
  - Prohibit aliases, fallbacks, OpenRouter, batch routes, regional substitution, provider-managed tools, local models, and substitute providers, models, or routes.
  - Freeze USD 11.51 expected subject to exact v4 graph reproduction, USD 15 conservative, USD 25 total hard cap, USD 10 OpenAI cap, USD 15 Anthropic cap, and 5200 maximum calls; no owner ceiling may increase here.
  - One later exact generic owner authorization conditionally covers the normal engineering-complete or honest quarantine path through provider revalidation, canaries, fresh custody, public commitment, prefix, full matrix, provider closure, output lock and commitment, post-lock unseal, protocol classification, Methods A/B/C, metric bounds, safety and corruption checks, redacted closeout, validation, PR readiness and squash merge, CI and Pages, live routes, issue closure, synchronized main, and one final schema-valid handoff.
