  - No reuse, retry, reopening, mutation, rescoring, splicing, deletion, unsealing, reactivation, or reauthorization of AO-0008 or any prior campaign or private artifact.
  - No global protocol-conformance threshold inferred from AO-0008 and no rerun until a preferred invalid-output rate appears.
  - No invalid-action parsing or credit, silent normalization, constructed action or portfolio, semantic retry, replacement pairing, complete-case unconditional effect, or unregistered metric.
  - No credential read, provider call, spend, real seed, private task, answer, key, nonce, ciphertext, commitment, custody object, or retained real v4 campaign state before exact owner authorization.
