  - Stop if a replacement pairing or batch, record splice, semantic retry, new private identity, or authority beyond the fixed DD-010 engineering contract is proposed.
  - Do not stop or quarantine solely because one or more completed pairings are protocol-invalid after the registered repair; classify, retain, bound, and continue under policy v2.
