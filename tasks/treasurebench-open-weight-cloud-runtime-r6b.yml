expected_outcomes:
- Exact owner-gate and owner-authorization gate_id properties are identical and reject the immutable failed 55-character identifier.
- A boundary-length gate ID admitted by the owner-gate schema creates a schema-valid synthetic authorization in a temporary test directory.
- The shorter exact gate preserves only RUNPOD_API_KEY, one inventory, conditional deletion of one unique exact ao0012-owcal-r5-01b41c9aa04bf2a4-hf Secret, one verification, three authenticated operations maximum, zero spend, and zero inference.
- One frozen execution commit, protected tree, validated unconsumed corrected gate, draft PR, and owner-gate-required handoff record zero credential, provider, resource, inference, and spend activity during repair.
stop_conditions:
- Stop before credential ingress or provider access on any schema, contract, issue, draft PR, branch, execution ancestry, protected tree, tracked-worktree, failed-gate-evidence, or authorization-state mismatch.
- Do not create an authorization during compatibility preparation; the earlier owner challenge applies only to the failed long-ID gate and is not reusable.
- During any later separately authorized cleanup, preserve the existing one-inventory, conditional-exact-delete, one-verification, three-operation, zero-spend boundary and stop on every ambiguity.
- Stop at owner-gate-required after validate-only succeeds; do not run the cleanup command.
