  - prove every ID admitted by the gate schema can be written as a schema-valid synthetic authorization
  - preserve and hash the failed long-ID gate, contract, audit, and handoff without rewriting them
  - bind the existing cleanup implementation to one shorter additive R6 gate and contract
  - validate the corrected gate without creating an authorization or invoking the cleanup
non_goals:
- No owner authorization creation or reuse; no .env.txt or credential read; no RunPod, Hugging Face, provider, Secret, template, Pod, model, endpoint, inference, billing, spend, calibration, merge, issue closure, publication, or release action.
- No widening of the owner-authorization schema or cleanup semantics; no fourth operation, retry, sibling-resource deletion, alternative target, or other resource surface.
- No DD-023, scientific run, private task, base campaign, performance result, claim, paper, DOI, submission, or scientific authority.
