owner_decisions:
- The long-ID R6 gate, its owner challenge, and its failed authorization attempt remain immutable audit history; no authorization was created and the old owner decision is not reusable.
- The generic owner-gate identifier contract must narrow to the existing owner-authorization identifier contract; the authorization schema must not be widened.
- The corrected gate identifier is AOG-AO-0012-R6-RUNPOD-SECRET-CLEANUP and changes no cleanup permission, credential, provider operation, cap, or outcome.
- R1 through R5 remain superseded or consumed exactly as recorded; no prior gate or authorization may be reused.
- Preparation uses repository, public GitHub, and synthetic evidence only and must stop before authorization, credential ingress, RunPod or Hugging Face access, resource activity, inference, or spend.
