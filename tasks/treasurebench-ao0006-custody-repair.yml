owner_decisions:
  - "AO-0007 has two inseparable tracks: one exactly authorized read-only adjudication of the retained AO-0006 custody failure, followed by a prospective synthetic reproduction, minimum repair, and live-mode-equivalent custody conformance proof."
  - Campaign treasurebench-agents-v1-repair-confirmation-v2, batch tb-agents-v1-repair-confirmation-v2-b01, execution commit d210b0653677859c79a1fb87d871aaf45f4a81d4, decision fresh-pilot-v2-quarantined-engineering-only, output lock sha256:127a9c796459c7627f6fd90b92ef1587ad0f6b1910b4ff255c2ceb976f3ab25f, and all retained AO-0006 state remain permanently immutable and non-reusable.
  - The AO-0006 boundary remains two successful public canaries, 1,349 input tokens, 253 output tokens, USD 0.0076095 total cost, zero private architecture/model runs, no task ciphertext, no answer ciphertext, no custody manifest, and no unsealing.
  - The diagnostic may run only after exact owner authorization and may verify the output lock, inventory, and append-only logs and read only the encrypted or redacted custody-failure record plus the minimum surrounding operational events needed to identify the failing operation.
  - The diagnostic must not read or disclose any seed value, key value, task text, answer, raw provider output, credential, private path, or unrelated retained object; it makes no provider call and mutates no retained state.
  - One detailed private diagnostic remains outside Git and one redacted public diagnosis may be committed after the authorized diagnostic.
  - After the diagnostic completes, private access closes permanently for this task; repair and validation use synthetic nonsecret content in an isolated temporary XDG state root and the same production custody functions and ordering required by a future real pilot.
  - No private pilot may be registered or executed here. Only after a repaired live-mode custody conformance pass may the next candidate be named TreasureBench Agents v1 wholly fresh sealed repair-confirmation pilot v3 registration, without allocating any v3 identity.
  - One generic owner gate covers the exact bounded diagnostic once and then the authorized offline repair, public-safe closeout, PR readiness, merge after checks, normal CI and Pages, live verification, issue closure, and main synchronization without another routine checkpoint.
