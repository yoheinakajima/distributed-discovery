  - No provider or local-model call, credential read, spend, new real private material, task ciphertext, answer ciphertext, custody manifest, or unsealing.
  - No seed value, task key, answer key, operational key, task text, answer, raw provider output, credential, private path, or unrelated retained object may enter Git or public output.
  - No DD-023, claim, scientific run, proof or evidence promotion, paper result, ranking, composite, package, release, DOI, submission, or base-campaign authority.
  - No private pilot registration or execution and no v3 campaign, batch, seed, task, answer, key, ciphertext, custody, or authorization identity allocation.
