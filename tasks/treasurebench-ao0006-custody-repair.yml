  actions:
    - Register AO-0007 with one issue, one branch, this fixed contract, one living ExecPlan, and one draft pull request.
    - Audit the public custody stack and implement an authorization-bound read-only diagnostic with exact object selection, no-provider, no-credential, no-mutation, private-read, and redaction guards.
    - Add synthetic diagnostic fixtures that distinguish generation, serialization, encryption, associated-data, nonce, atomic-create, permission, commitment, manifest, persistence, and reload or verification failures.
    - Add an offline live-mode custody conformance command using production custody functions and ordering under an isolated temporary XDG state root.
    - After the one owner-authorized diagnostic, reproduce the exact failing shape synthetically, implement the minimum prospective repair, preserve the failure as a regression fixture, and add an independent verifier and corruptions.
    - Reconcile only public-safe Agent Operations, DD-010 engineering status, program memory, current-state, roadmap, handoff, benchmark, site, and public records.
    - Run the full validation wall and, only under the exact gate, complete PR readiness, merge, normal CI and Pages, named live-route verification, issue closure, and synchronized main.
non_goals:
