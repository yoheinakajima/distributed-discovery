title: Novelty-first behavioral diversity and distributed discovery campaign
task_type: scientific-execution
status: active
objective: Preserve the academic landscape and conduct at most six bounded, novelty-screened synthetic research tracks under DD-024, with genuine policy evaluation, fair comparators, immutable provenance, independent checks, and calibrated conclusions.
