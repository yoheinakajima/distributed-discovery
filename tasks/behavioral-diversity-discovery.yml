owner_decisions:
  - The current owner instruction authorizes preserving the academic literature and performing parallel quantified synthetic research; this explicitly supersedes the prior editorial-only scientific-execution limitation for this campaign alone.
  - Use one coordinated task branch and draft pull request for DD-024, leave the expected DD-023 benchmark evaluation unallocated, and coordinate at most six research tracks within the same study.
  - Screen and save each track's literature overlap and potential contribution before writing its scientific implementation or executing its primary configuration; classical overlap and null findings are valid outcomes.
  - Freeze each admitted model, configuration, estimands, comparators, resources, seeds, independent verifier, corruptions, and stopping rules before primary execution from clean committed source in isolated detached worktrees.
  - Authorize no provider calls, private data, spend, publication, submission, merge, or deployment; synthetic findings do not establish personality, human-behavior, or societal-welfare conclusions.
  - Preserve the completed three-run allocation as audited exploratory evidence with zero central claim promotions; final repository validation and draft review remain authorized, while no additional primary attempt or paper promotion is inferred.
