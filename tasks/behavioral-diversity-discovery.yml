    - docs/claim-prominence.yml
    - docs/paper-claim-roles.yml
    - results/index.md
    - results/exploratory
    - results/verified
    - results/refuted
    - reports/agent-ops
    - site/content/relations.yml
  actions:
    - Store the sourced literature landscape, search limitations, evidence distinctions, and repository overlap map without copying private conversation transcripts.
    - Register DD-024 and at most six prospective tracks covering persistence and role rotation, nonstationary adaptation, commitment and switching costs, communication timing, reliability and downside, and information externalities or robustness.
    - Admit, narrow, pivot, defer, or stop candidate tracks using recorded prior-art and classical-reduction checks before scientific code or primary execution; these mechanism areas are not fixed experimental models.
    - Implement a genuine policy evaluator and a materially distinct verification route; an evaluator returning expected or hand-entered metrics is not evidence.
    - Compare relevant homogeneous intermediate policies, adaptive generalists, rotating specialists, fixed mixtures, and a coordination upper benchmark where meaningful under equal evidence and action budgets.
    - Freeze code and all per-track registrations before at most one primary sub-run per admitted track, with an initial hard cap of 120 seconds and 1024 MiB per primary sub-run.
    - Execute admitted sub-runs in parallel only after the shared freeze, using isolated detached worktrees and noncolliding immutable output directories; serialize shared-source and ledger integration.
    - Preserve null, negative, overlap, failed, interrupted, and resource-limited outcomes and report simulation uncertainty without turning synthetic estimates into human or social claims.
    - Audit every proposed numerical claim separately against its immutable run and independent checks before updating the claim ledger, study status, result index, and current plans together.
    - Maintain required scientific and public-projection mappings, validate the registered acceptance profile, and prepare one reviewable draft PR and truthful typed handoff.
non_goals:
  - No claim that personality types, low conscientiousness, unpredictability, or a fixed population mixture improve human welfare.
  - No human experiment, observational human dataset, private evaluation, credential access, provider model call, cloud resource, or spend.
  - No reuse or reclassification of historical benchmark pilots, benchmark evaluation allocation, or reopening of stopped historical formulations merely under a new label.
  - No passing-primary rerun for freshness, unregistered parameter expansion, silent replacement of failed runs, or invented novelty or optimality.
  - No theorem or proof promotion, paper admission or lifecycle change, canonical-upstream mutation, merge, deployment, release, DOI, submission, or external outreach.
permissions: {repository_write: true, git_branch_commit: true, github_issue_pr: true, merge_after_checks: false, ci_pages: false}
external_action_permissions: {network_observation: true, github_mutation: true, provider_calls: false, spend: false, release_publication: false, submission: false}
scientific_mutation_permissions: {create_study: true, create_claim: true, create_run: true, change_evidence_status: true, change_proof_status: false, change_paper_lifecycle: false}
private_data_permissions: {read: false, write: false, generate: false, publish: false}
budget: {currency: USD, expected: "0", hard_cap: "0", call_cap: 0, category_caps: {}, cumulative_spend: "0"}
expected_outcomes:
  - A durable cited literature landscape with evidence boundaries and a saved novelty disposition for every proposed track.
  - One registered synthetic study containing at most six exact frozen track configurations and at most six primary sub-runs, or recorded reasons for stopping without execution.
  - Reproducible policy-evaluated outputs, independent checks, corruption results, uncertainty where applicable, and preserved nulls and failures.
  - A separate claim audit and a source-traceable research report that distinguishes bounded computational findings from unresolved empirical questions.
  - One validated draft PR and restartable handoff without merge or publication.
stop_conditions:
  - Stop a track before scientific code or primary work until its novelty and classical-overlap disposition has been saved.
  - Stop a primary run unless the exact model, source, config, resources, estimator, seeds, comparator budgets, independent verifier, corruptions, and stopping outcomes are frozen and a draft PR exists.
  - Stop on dirty or mismatched source, output collision, resource-cap breach, invalid comparator accounting, corruption-test failure, or unresolved independent-verifier disagreement; preserve the attempted run.
  - Stop at six admitted tracks or six primary sub-runs; do not expand a frozen model or consume additional primary runs without a newly recorded scope decision.
  - Stop before provider access, private-data access, spend, proof promotion, paper-lifecycle change, merge, deployment, release, DOI, submission, or external outreach.
