owner_decisions:
  - "AO-0009 has two inseparable phases: authorization-free implementation of one exact bounded read-only diagnostic, followed after one generic owner gate by the single diagnostic invocation and only the evidence-determined prospective repair or policy branch."
  - Task AO-0008, campaign treasurebench-agents-v1-repair-confirmation-v3, batch tb-agents-v1-repair-confirmation-v3-b01, execution commit 0f9d82bb50cbb334bea47e24448831faf0cdbed8, decision fresh-pilot-v3-quarantined-engineering-only, stage fixed-full-batch, failure class fixed-full-batch-failure, and all retained state remain permanently immutable and non-reusable.
  - The permanent boundary includes two passed public canaries, passed custody and private prefix, 3,067 calls, 2,304,303 input tokens, 444,085 output tokens, USD 13.1861145 total cost, OpenAI USD 4.5952575, Anthropic USD 8.590857, 3,576 locked objects, output lock sha256:e52055b08ca3a8acb1cfb6ac608c6e601f3c618352900f92bf91c5ffc4718dbb, a closed provider phase, zero calls after lock, no unsealing, and no scientific or performance evidence.
  - The difference between 3,067 actual attempts and 3,016 normal calls is not evidence of a particular cause; the diagnostic must reconstruct attempts, logical calls, completions, recovery, terminals, pairings, durable stage, output presence, exception stage, and safe error code from permitted evidence.
  - Before owner authorization, audit only public source and records; freeze the exact read allowlist; implement the one-use diagnostic, mutation guards, synthetic fixtures, taxonomy, redaction, corruptions, validation, execution freeze, generic gate, and owner-gate-required handoff.
  - The diagnostic may read only the output-lock record and commitments, execution identity, provider-stage state, append-only access and usage/cost ledgers, structural metadata for encrypted responses and traces, the exact failed logical-call record selected from the ledgers, at most two preceding and two following attempt or orchestration records, and only the directly corresponding encrypted response and trace objects.
  - The operational key may be used transiently only to decrypt those exact selected response and trace objects. The OS-CSPRNG seed, task key, answer key, task or answer ciphertext or content, custody corpus, hidden targets, unrelated responses or traces, task-level performance, comparisons, credentials, and private host paths are prohibited.
  - The diagnostic writes one detailed nonpublic result outside Git and emits one redacted public-safe result; it creates a one-use marker before retained access, permanently closes private-read authority after the invocation, and must fail closed on any attempted second read.
  - If evidence establishes a local runtime, parser, trace, ledger, pairing, state, completion-marker, or verifier defect, reproduce it synthetically, make the minimum prospective repair, preserve the regression, add independent verification, deterministic fault injection, and pass the full 50-task/500-run rehearsal.
  - If evidence establishes genuine provider terminal failure or valid provider output that violates the agent protocol, preserve that classification and stop at a separate provider-reliability or agent-protocol policy-decision requirement without normalizing, semantic retry, silent repair, or automatic v4 registration.
  - If evidence is inconclusive within the allowlist or the output lock, inventory, or no-mutation checks fail, stop honestly without guessing, repair, broader access, or new campaign registration.
  - One generic owner gate covers exactly one diagnostic invocation, transient bounded operational-key use, permanent private-read closure, subsequent synthetic repair or policy adjudication, public-safe reconciliation, validation, PR readiness and merge after checks, normal CI/Pages, named live routes, issue closure, synchronized main, and one final schema-valid handoff.
