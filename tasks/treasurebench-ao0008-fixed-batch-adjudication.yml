  actions:
    - Register AO-0009 with one issue, task branch, this fixed contract, one living ExecPlan, and one draft pull request.
    - Audit the public AO-0008 runtime, call and orchestration control flow, append-only ledgers, encrypted response and trace indexing, pairing bookkeeping, state transitions, failure and quarantine policy, and output-lock inventory.
    - Freeze the causal taxonomy and an exact private-read allowlist with record and encrypted-object ceilings before owner authorization.
    - Implement one authorization-bound one-use read-only diagnostic with exact owner-gate binding, output-lock and inventory verification, transient bounded decryption, before-and-after byte and metadata snapshots, redaction, and permanent access closure.
    - Add synthetic fixtures and corruptions for every causal class and preserve bounded-evidence unknowns without guessing.
    - After the one owner-authorized diagnostic, execute only the evidence-determined prospective implementation repair or provider or agent-protocol policy branch.
    - For an implementation repair, preserve a regression, add independent structural verification and deterministic fault injection, and rerun the full 50-task and 500-pairing synthetic graph with Methods A/B/C, cardinality, contamination, ranges, output locking, redaction, and cost accounting.
    - Reconcile only public-safe Agent Operations, DD-010 engineering status, program memory, current-state, roadmap, handoff, benchmark, site, and public records.
    - Under the same exact gate, complete validation, PR readiness, merge after checks, normal CI and Pages, named live-route verification, issue closure, and synchronized main.
non_goals:
  - No reopening, retrying, continuing, executing, reusing, rescoring, splicing, mutating, deleting, broadly unsealing, or reauthorizing AO-0008 or its campaign, batch, authorization, ledgers, output lock, retained objects, or decision.
  - No second private read, bulk unseal, unrelated response or trace access, or access beyond the frozen record and object ceilings.
  - No OS-CSPRNG seed value, task key, answer key, task or answer ciphertext or content, custody task corpus, hidden target, task-level performance metric, model or architecture comparison, credential, or private host path may enter Git or public output.
  - No provider or local-model call, credential read, spend, new real private material, new private campaign, or v4 campaign or batch identity.
  - No change to the registered failure policy solely because AO-0008 failed and no normalization, silent repair, semantic retry, or credit for agent-protocol-invalid output.
  - No DD-023, claim, scientific run, proof or evidence promotion, paper result, ranking, composite, package, release, DOI, submission, or base-campaign authority.
