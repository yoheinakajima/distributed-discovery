    - Reconstruct the terminal OpenAI HTTP 400 serialized request using public fixtures only.
    - Separate the canonical semantic contract, provider-specific strict-output schema compilers, offline subset linters, and provider-independent post-parse validation.
    - Implement bounded redacted provider-error retention and a deterministic mock public-canary matrix.
    - Add every required corruption for provider schema, semantics, safe errors, routes, models, aliases, fallbacks, calls, and spend.
    - Commit and validate one generic owner-gate manifest for the later tiny public-canary sequence.
    - Create and maintain issue #198, the task branch, and one draft pull request.
non_goals:
  - No retry repair reopen reuse rescore execution or reauthorization of AO-0002 or either quarantined campaign or batch.
  - No private-data read write generation deletion or publication and no private campaign custody task answer seed key ciphertext or run.
  - No provider call credential access or spend before the exact generic owner gate.
  - No aliases fallbacks OpenRouter batch routes regional routes or local models.
  - No DD-023 claim scientific run evidence or proof promotion paper ranking composite package release DOI arXiv journal submission or base campaign.
  - No declaration of conformance from only a minimal or trivial schema.
