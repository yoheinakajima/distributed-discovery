owner_decisions:
  - The AO-0002 campaign, batch, execution commit, output lock, terminal OpenAI HTTP 400 canary, inactive archived R2 authorization, and sealed-pilot-quarantined-provider-failure decision remain permanent and may not be reopened, retried, repaired in place, reused, rescored, reauthorized, or executed.
  - The canonical semantic action contract must remain provider-independent; provider-specific transport compilers may omit unsupported keywords only when deterministic post-parse semantic checks preserve equivalent invariants.
  - Offline provider-schema conformance checks must fail before any paid call when a schema is outside the documented provider subset.
  - Both providers must pass their complete exact TreasureBench action schema before conformance can be declared or a new private pilot can be considered.
  - Any public provider call, credential access, or spend requires the separately committed exact generic Agent Operations owner gate.
