expected_outcomes:
  - A current official-source audit of both exact direct provider request and strict-schema boundaries.
  - Provider-independent semantics, separate OpenAI and Anthropic strict-output compilers, deterministic offline linting, and provider-independent post-parse validation.
  - Safe bounded structured provider errors and exact public serialized fixtures sufficient to diagnose the prior HTTP 400 without private-state access.
  - A mock canary matrix in which both complete provider-specific TreasureBench action schemas pass and every registered corruption fails closed.
  - One exact generic owner-gate manifest and schema-valid owner-gate-required handoff for a later public-only canary sequence expected to cost less than USD 0.10.
stop_conditions:
  - Stop before reading credentials making any provider call or incurring spend until the exact committed generic owner authorization exists.
  - Stop on any attempt to access or mutate private state or either quarantined campaign batch execution record output lock or archived authorization.
  - Stop immediately on any route model alias fallback privacy schema call-cap spend-cap or authorization mismatch.
  - Stop if an unsupported transport keyword is removed without deterministic equivalent semantic validation and regression coverage.
  - Stop if either complete provider-specific TreasureBench action schema fails; bounded bisection may follow only within the registered call and spend caps after owner authorization.
  - Stop on scientific paper release submission package or base-campaign mutation.
