expected_outcomes:
  - A provider-current, wholly fresh, repaired 50-task and 500-run sealed engineering pilot implementation.
  - Passing offline rehearsal, independent contract verification, corruption rejection, and draft-PR acceptance.
  - A committed exact owner-gate manifest and schema-valid owner-gate-required handoff before consequential action.
stop_conditions:
  - Stop before any credential read, private generation, custody creation, provider call, or spend without the exact active owner authorization.
  - Stop if campaign, batch, seed, task, answer, key, custody, quarantined-pilot, future-base, or base-campaign identity separation fails.
  - Stop if any provider route, exact model, structured-output contract, retention term, retry policy, price, cap, or authorization surface is unresolved.
  - Stop if any repaired rehearsal, Method C, metric-range, corruption, schema, budget, custody, redaction, or Agent Operations check fails.
  - Stop if scientific inventories, paper artifacts, release state, public private-data boundary, or unrelated preservation files change.
