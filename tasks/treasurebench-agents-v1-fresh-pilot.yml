owner_decisions:
  - The selected gate is the full fresh 50-task and 500-run repair-confirmation pilot.
  - The pilot uses five architectures, direct OpenAI and direct Anthropic routes, and one repeat.
  - Campaign, batch, OS-CSPRNG seed, tasks, answers, encryption keys, and custody must all be new.
  - The quarantined pilot, future-base identities, and base-campaign identities may not be reused.
  - Provider calls, credentials, private generation, custody creation, and spend require the exact committed owner gate.
  - The provisional budget is USD 15 expected, USD 25 hard cap, USD 10 OpenAI, USD 15 Anthropic, and 5,200 calls.
