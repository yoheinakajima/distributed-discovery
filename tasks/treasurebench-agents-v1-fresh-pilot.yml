    - Audit current official provider routes, models, structured outputs, retention, retries, errors, and prices.
    - Implement the fresh identity, custody, execution, verification, redaction, and fail-closed budget boundaries offline.
    - Run the repaired 50-case synthetic rehearsal and every registered corruption with zero credentials, calls, private generation, or spend.
    - Freeze the exact execution commit and commit one generic Agent Operations owner-gate manifest.
non_goals:
  - No DD-023, claim, scientific run, proof, evidence-status change, or paper result.
  - No ranking, composite, leaderboard, package, release, DOI, arXiv, journal, or submission action.
  - No base campaign, local or open-model campaign, OpenRouter route, fallback route, or model substitution.
  - No reuse, mutation, rescoring, deletion, or unsealing of the quarantined pilot or reserved future-base state.
  - No credential read, private generation, custody creation, provider call, or spend before the exact owner authorization.
