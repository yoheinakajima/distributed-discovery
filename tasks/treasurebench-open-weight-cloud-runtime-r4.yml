owner_decisions:
- Physical ownership of the GPU is not scientifically necessary; the candidate is an open-weight, self-operated cloud runtime and supplies model and inference-stack independence, not physical locality or complete infrastructure independence.
- The exact identity remains Mistral Small 3.1 24B Instruct revision 68faf511d618ef198fef186659617cfd2eb8e33a, original unquantized BF16 artifacts, Tekken tokenizer, vLLM 0.23.0 immutable Linux/amd64 container, and one RunPod Secure Cloud dedicated noninterruptible NVIDIA A100 80GB PCIe.
- R1, R2, and R3 owner gates are unused, unauthorized, and superseded; none may be created, consumed, or treated as authority.
- Before credential ingress, issue #212 and draft PR #213 are checked through fixed unauthenticated public GitHub REST GETs and the branch through git ls-remote; the live path never depends on gh authentication.
- Repository-root .env.txt is read only after exact R4 authorization and pre-ingress validation, through the strict nonexecuting loader, and may return only RUNPOD_API_KEY and HF_TOKEN.
- GraphQL uses only URL-encoded api_key query authentication for inventory and temporary Secrets; REST uses only Authorization Bearer for templates, encrypted Pod create/get/delete, and billing.
- Pod creation uses POST https://rest.runpod.io/v1/pods with one exact field set, volumeEncrypted true, no network volume, no public IP, no fallback, and no second create under one authorization.
- Three short-lived RunPod Secrets and one temporary private template are deleted and verified absent after the exact Pod is deleted and verified absent.
- Because the selected encrypted REST create surface has no native terminateAfter field, orphan control is the unconditional controller finalizer plus a Pod-resident watchdog that verifies and self-deletes the exact Pod at a six-hour monotonic deadline using only its Pod-scoped key.
- The ten-public-task, five-architecture, one-repeat, 50-pairing calibration remains operational-only with six GPU-hours, 400 calls, expected spend under USD 10, and USD 20 hard total cap.
- Every possible Pod path performs teardown, temporary-resource deletion, positive exact billed-time and amount reconciliation including returned storage charge, cap enforcement, and one schema-valid redacted outcome before any merge or issue closure.
- This task creates no DD-023, scientific run, claim, private task or holdout, base campaign, performance publication, paper, release, DOI, submission, managed-model call, quantized identity, sharded identity, or alternate hardware identity.
