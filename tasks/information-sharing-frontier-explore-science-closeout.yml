  - Stop if an accepted change needs new research, an immutable run, a new claim, a status promotion, or an unavailable online-only review finding.
  - Stop if package extraction cannot compile twice to the canonical PDF, any page fails visual QA, or the complete deterministic wall fails from the exact branch.
