  - On 2026-08-29 the owner authorized one narrow draft-PR repair after the accepted Common-Source Trap merge passed CI but its exact-head Pages build failed because the runner lacked Tectonic and Poppler.
  - The repair may add only the CI-equivalent Tectonic 0.16.9 setup and poppler-utils installation to Pages plus the smallest ordering regression and governance records.
  - Issue 220 remains open and merge, manual Pages dispatch or retry, deployment, publication, and arXiv submission remain separate owner-controlled actions.
