  - No raw output, prompt, task, answer, hidden target, action, dimensional identity, performance value, ranking, comparison, credential, or private path in Git or public output.
  - No Method A/B or metric-range immediate-cause classification for the live fixed-full-batch stage.
  - No DD-023, claim, scientific run, proof or evidence promotion, paper result, ranking, package, release, DOI, submission, or base-campaign authority.
