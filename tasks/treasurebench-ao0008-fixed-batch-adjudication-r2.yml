  - Stop if the output lock, inventory, ledger chains, exact response-attempt set, exact 2/50/450 trace partition, authentication, cap reconstruction, durable-stage reconstruction, or complete before/after equality fails.
  - Stop if trace extraction exceeds the exact aggregate fields, 450 fixed-full-batch traces, one selected logical call, two responses, four neighbors, or one transient 32-byte operational key.
  - Stop if raw or dimensional content would be retained or published, or if a second read, unrelated object, seed, task key, answer key, task or answer content, credential, or private path would be required.
  - Stop if a provider call, credential read, spend, new campaign or batch, v4 identity, scientific or publication authority, release, submission, or broader policy change would be required.
