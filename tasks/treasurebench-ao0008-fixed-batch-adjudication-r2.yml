owner_decisions:
  - AO-0009 continues in the same session, issue, branch, living ExecPlan, and draft pull request; no replacement task, issue, branch, PR, session, campaign, or batch is created.
  - The unused AOG-AO-0009-AO0008-FIXED-BATCH-DIAGNOSTIC gate and original AO-0009 contract are prospectively superseded and receive no authorization.
  - AO-0008, its campaign and batch, output lock, 3,576 retained objects, closed provider phase, quarantine, decision, cost and call totals, and all retained bytes and metadata remain permanently immutable and non-reusable.
  - Public object arithmetic is consistent with 2 canary, 50 prefix, and 450 fixed-full-batch traces; because the frozen runner persists each trace before applying aggregate gates, the failure-causing trace may be anywhere in the 450-trace full batch.
  - The live fixed batch used verify_metrics=false. Immediate cause ordering is terminal or persistence failure during a run; after-loop direct or probable contamination; after-loop protocol-contract failure including final cardinality; pairing completeness; then completion-marker or state transition.
  - Method A/B and metric-range checks were not computed during the live fixed-full-batch stage and cannot be classified as its immediate cause.
  - The one-use diagnostic may transiently authenticate and decrypt exactly all 450 fixed-full-batch trace objects and extract only authentication, stage, protocol-error presence, invalid final cardinality, direct or probable contamination, parse or schema-repair failure, retry count, and hash-only trace identity.
  - Raw trace content remains transient in process memory and is discarded immediately. Raw output, prompts, task text, answers, hidden targets, actions, task/model/provider/architecture dimensions, task metrics, performance, rankings, comparisons, and private paths are neither retained nor published.
  - Public output is aggregate only and may report authenticated trace count, protocol, cardinality, contamination, parse or schema-repair counters, exact 450-trace pairing completeness, structural response-ledger correspondence, durable stage, and the resulting causal class.
  - The bounded provider-response rule remains one unique terminal logical call when one exists, otherwise the final durable logical call, at most two corresponding response decryptions, and at most two preceding and two following operational records.
  - Structural verification compares the complete 3,067 ledger attempt-identity set to the complete encrypted response-domain set, rejects missing, orphaned, duplicate, or conflicting identities, proves the unique 2/50/450 trace partition, checks caps from the frozen ledger and ceilings, and identifies the exact last durable access and state stage.
  - Causal precedence is retained-integrity mismatch; response-ledger or trace persistence; terminal provider failure; contamination policy; final-action cardinality; other protocol nonconformance; pairing completeness; state-transition or completion marker; then bounded-evidence unknown.
  - When all 450 fixed-batch traces authenticate, aggregate contamination and protocol counters are zero, response-ledger correspondence is exact, and only the completion marker is absent, classify the minimum exact local state-transition or completion-marker defect supported by the access log and frozen source.
  - The read-intent marker precedes retained access, the complete retained byte and metadata state is compared before and after, the transient operational key is zeroed, one detailed nonpublic record stays outside Git, and private-read authority closes permanently after the invocation.
  - One R2 owner gate covers the exact one-use diagnostic, only the evidence-determined prospective repair or policy adjudication, public-safe reconciliation, validation, PR readiness and merge after checks, normal CI/Pages and named routes, issue closure, synchronized main, and a final schema-valid handoff.
