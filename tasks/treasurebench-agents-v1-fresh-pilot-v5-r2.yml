expected_outcomes:
  - One authorization-free R2 execution package proving the deterministic bounded delay, safe metadata, append-only restart semantics, no third attempt, and unchanged calls, tokens, cost, circuit breakers, and denominators.
  - One committed R2 owner gate that stops before credentials, real private generation, provider calls, spend, or real unseal.
  - After later exact R2 authorization only, one normal engineering-complete or honest-quarantine closeout under the unchanged v5 scientific and operational ceilings.
stop_conditions:
  - Before authorization, stop exactly once after the committed R2 owner gate and schema-valid R2 owner-gate-required handoff.
  - Stop if authorization validity, identity, route, model, cap, provider phase, retained state, recorded delay decision, execution tree, or ledger integrity fails before waiting or dispatch.
  - Stop if a third attempt, changed or duplicate retry, raw header or error-message retention, semantic or outcome retry, replacement, jitter, policy change, identity change, cap increase, or circuit-breaker change is proposed or observed.
  - Stop if work would read credentials or retained private state, generate real private material, call a provider, spend, or unseal before exact R2 owner authorization.
  - Stop if scientific, publication, release, submission, base-campaign, or prior-campaign authority would be required.
