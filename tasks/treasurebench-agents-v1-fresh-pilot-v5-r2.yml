    - Implement the exact deterministic delay parser, safe metadata extraction, append-only delay selection and completion records, restart semantics, and injected sleeper or clock.
    - Add the required unit, integration, corruption, leakage, cap, authority, closure, accounting, circuit-breaker, and denominator tests.
    - Rerun every authorization-free rehearsal and validation wall required by the owner amendment.
    - Freeze, commit, push, and obtain draft-PR CI for the corrected execution surface.
    - Commit and validate AOG-AO-0011-FRESH-PILOT-V5-R2, then stop at owner-gate-required without creating or consuming authorization.
non_goals:
  - No authorization creation or consumption, .env.txt read, credential read, real private generation, provider call, spend, or real unseal before exact later R2 authorization.
  - No v4 or earlier campaign diagnosis, modification, unseal, retry, reuse, inference, reclassification, or retrospective policy rewrite.
  - No change to attempt ceilings, schema-repair count, semantic or outcome retry rules, pairing or batch replacement, random jitter, circuit breakers, protocol-validity policy v2, provider-outcome policy v3, identities, caps, routes, models, credential subset, or denominators.
  - No DD-023, claim, scientific run or evidence, proof or evidence promotion, paper modification, ranking, composite, leaderboard, package, release, DOI, publication, submission, or base campaign.
