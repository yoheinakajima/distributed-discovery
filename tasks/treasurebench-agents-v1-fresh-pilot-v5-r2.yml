owner_decisions:
  - AO-0011 continues in the same Codex task, repository, issue 210, draft pull request 211, branch, living ExecPlan, campaign, and batch; no replacement task, issue, branch, pull request, campaign, batch, session, or private identity is created.
  - The unused AOG-AO-0011-FRESH-PILOT-V5 gate and original AO-0011 contract are prospectively superseded and receive no authorization; no v4 or earlier campaign is modified or diagnosed.
  - Preserve at most two transport attempts for one identical logical request, exactly one schema-only repair, zero semantic-answer retries, zero outcome-dependent retries, zero replacement pairing or batch, zero random jitter, protocol-validity policy v2, provider-outcome policy v3, and the three-consecutive and ten-cumulative circuit breakers.
  - Freeze retry-delay bounds at one second minimum and 30 seconds maximum, with class fallbacks of two seconds for timeout, transient transport, and invalid provider JSON and five seconds for rate limit and transient provider, overload, or service error.
  - Use only a safely parsed direct-provider Retry-After value when available, clamped to the one-to-30-second range; otherwise use the registered class fallback.
  - Never wait or retry for provider-contract-or-safety failure, after provider-phase closure, after authorization, identity, cap, route, model, or retained-state failure, or beyond the existing two-attempt ceiling.
  - Persist no raw header or raw error body. Public or private operational retry metadata is restricted to retry_delay_seconds, retry_delay_source, retry_class, and transport_attempt.
  - The append-only private ledger must bind the first failed attempt identity, registered provider-outcome disposition, immutable delay decision and source, delay completion, second attempt identity, and absence of any third attempt.
  - A restart after the first attempt must replay the recorded delay decision, neither bypass the delay nor create a duplicate or unregistered retry, and reject any changed delay after restart.
  - Real authorized live mode uses an injected real sleeper; tests and authorization-free rehearsals use a deterministic no-wait recorder and make no credential read or network call.
  - Preserve every current identity, route, exact model, credential subset, cap, circuit breaker, denominator, pricing and token accounting rule, retention boundary, prohibition, and prior-campaign immutability.
  - Revalidate the complete 50-task and 500-pairing rehearsal, provider-outcome and circuit-breaker scenarios, independent classification, interval and contrast-bound reconstruction, custody, commitments, lock, post-lock replay, redaction, deterministic cleanup, focused tests, repository tests, and draft-PR CI.
  - R2 binds the new execution commit and protected tree hashes, the exact delay table and parser, unchanged policies, campaign, batch, routes, models, credential subset, circuit breakers and caps, the exact live command, and the normal engineering-complete or honest-quarantine closeout.
