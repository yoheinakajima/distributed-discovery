owner_decisions:
  - Common-Source Trap is the only active paper in this task; Information Sharing Frontier is parked.
  - The repository remains the sole manuscript, claim, proof, run, and evidence authority; Research Atlas manages exact pointers, review-round status, reviewer provenance, and handoffs only.
  - Freeze the current main manuscript source, PDF, hashes, validation receipts, evidence pointers, and build instructions before independent review.
  - Do not edit the manuscript until fresh independent ChatGPT, Claude, Gemini, and Grok reviews are all complete and Research Atlas returns the complete bundle simultaneously.
  - After that complete bundle arrives, preserve reviewer provenance, create a disposition table, revise only against repository evidence, rebuild, and rerun all paper-native checks.
  - The active Pages incident does not block offline review preparation.
scope:
  paths:
    - tasks/common-source-trap-independent-review.yml
