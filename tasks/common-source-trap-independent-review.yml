  actions:
    - Register AO-0014 from the exact verified main commit, issue, and task branch.
    - Freeze a public-safe machine-readable review packet and concise reviewer guide without modifying the manuscript or its generated artifacts.
    - Validate every frozen hash, claim, run, receipt, toolchain pointer, lifecycle boundary, and build command against the exact source commit.
    - Rebuild the paper in a disposable checkout and run focused and complete docs-editorial validation.
    - Commit, push, and open one draft pull request, then stop at a legitimate checkpoint awaiting the complete four-review bundle.
    - Only after the complete simultaneous bundle arrives, record reviewer provenance and dispositions, revise from repository evidence, rebuild, and stop before manuscript merge.
non_goals:
  - No manuscript edit before the complete four-review bundle is returned simultaneously.
  - No action on Information Sharing Frontier or its five historical untracked files.
  - No new study, claim, proof, run, evidence-status change, proof-status change, or paper-lifecycle change.
  - No Explore Science upload, provider call, credential access, spend, scientific execution, publication, submission, DOI, release, or journal contact.
  - No draft-PR readiness, manuscript merge, issue closure, branch deletion, Pages retry, deployment, or live-site mutation.
  - No mutation of issue 212, issue 218, AO-0012 or AO-0013 history, or retained historical branches.
