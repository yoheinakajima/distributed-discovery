expected_outcomes:
  - One exact immutable review baseline for the 21-page Common-Source Trap working paper at the verified source commit.
  - One machine-readable packet and reviewer guide that preserve repository authority and permit Atlas to coordinate four independent reviews without becoming scientific authority.
  - Passing deterministic packet, claim, citation, provenance, reproducibility, paper-build, and repository-governance checks.
  - One draft PR that remains unmerged while AO-0014 waits for the complete four-review bundle.
  - After that bundle, one provenance-complete disposition table and evidence-bound revision candidate that stops before merge.
stop_conditions:
  - Stop if the manuscript, PDF, generated paper artifact, claim record, proof, immutable run, or evidence status changes before the complete review bundle arrives.
  - Stop if any reviewer sees another review before completing an independent review or if Atlas cannot return all four reviews as one complete provenance-bound bundle.
  - Stop if a review recommendation cannot be resolved to repository evidence or requires new scientific execution.
  - Stop before any credential, provider, private-data, spending, publication, release, submission, DOI, or live-deployment action.
  - Stop before marking the draft PR ready or merging the manuscript; that remains a separate consequential repository gate.
