non_goals:
  - No DD-023, claim, immutable scientific run, evidence or proof promotion, paper result, task/model/provider/architecture/family performance publication, ranking, composite, leaderboard, package, release, DOI, submission, or base campaign.
  - No retrospective v4 diagnostic and no read, reopen, unseal, diagnose, rerun, reuse, rescore, splice, mutate, delete, execute, or reauthorize v4 or any prior campaign.
  - No inference about the hidden v4 provider, route, or exact error and no tuning against v4.
  - No scientific provider-missingness threshold and no rerun until a preferred availability rate appears.
  - No semantic or outcome-dependent retry, replacement pairing or batch, invented action, invalid or missing action credit, silent normalization, denominator drop, complete-case unconditional effect, or unregistered metric.
  - No credential read, provider call, spend, real seed, private task, answer, key, nonce, ciphertext, commitment, custody object, or retained real v5 campaign state before exact owner authorization.
  - No execution-sensitive change, identity change, model or route substitution, cap or circuit-breaker increase, replacement batch, new private identity, or authority expansion after authorization without a separate owner decision.
