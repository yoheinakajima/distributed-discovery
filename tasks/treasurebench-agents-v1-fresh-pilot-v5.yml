owner_decisions:
  - Register AO-0011 as the sole substantive lane for prospective provider-outcome and missingness policy v3 and one wholly fresh sealed repair-confirmation pilot v5; create no separate retrospective v4 diagnostic task.
  - Preserve AO-0010, protocol-validity policy treasurebench-agents-v1-protocol-validity-policy-v2, campaign treasurebench-agents-v1-repair-confirmation-v4, batch tb-agents-v1-repair-confirmation-v4-b01, execution commit 5289882dca6b8912a0518bba72aba1f4d595c2a8, decision fresh-pilot-v4-quarantined-engineering-only, both passing public canaries, passing wholly fresh custody, provider-terminal-missing prefix stop, exact usage and cost, 150 locked objects, output lock sha256:88c442bf6cb5e1b99a893808d423b488d2b1062543a49fcfb32b77f276abaa1c, closed provider phase, zero calls after lock, no unseal, and no real-batch methods, classifications, bounds, performance interpretation, or scientific evidence.
  - Never reopen, read, unseal, diagnose, rerun, repair in place, reuse, rescore, splice, mutate, delete, execute, or reauthorize v4 or any earlier campaign; infer or claim no provider, route, or exact private error for v4.
  - Treat v4 only as the public engineering observation that zero-tolerance provider-terminal handling can prevent even a 10-percent prefix from completing; do not choose thresholds to make v4 retroactively pass or tune policy, prompts, schemas, retries, or thresholds against the hidden event.
  - Freeze one prospective forward-only provider-outcome policy v3 separating protocol-valid, protocol-invalid, provider-operational-missing, and provider-contract-or-safety-failure without rewriting any historical policy, schema, campaign, trace, decision, or lock.
  - Classify a safely retainable completed provider response by protocol validity, including refusals, token-limited or otherwise nonconforming structured responses; never silently downgrade a completed response to transport missingness.
  - Register OpenAI operational classes openai-client-timeout, openai-transient-transport, openai-rate-limit-reached, openai-server-error, openai-overloaded, and openai-invalid-provider-envelope-exhausted, each only after the bounded identical-request transport policy yields no completed usable response.
  - Register Anthropic operational classes anthropic-client-timeout, anthropic-transient-transport, anthropic-rate-limit-error, anthropic-api-error, anthropic-timeout-error, anthropic-overloaded-error, and anthropic-invalid-provider-envelope-exhausted, each only after the bounded identical-request transport policy yields no completed usable response.
  - Treat quota or billing exhaustion, request/schema/parameter rejection, exact-model mismatch, route/alias/fallback/regional/batch/provider substitution, hidden-reasoning boundary failure, credential or authorization failure, retained-state/ledger/trace/response identity failure, execution identity failure, unregistered error class, unsafe response retention, and ambiguous operational-versus-contract status as provider-contract-or-safety-failure with immediate quarantine.
  - Preserve at most two bounded transport attempts for the identical logical request, exactly one schema-only repair, zero semantic-answer retries, zero outcome-dependent retries, zero replacement pairing, zero replacement batch, zero silent normalization, zero invalid-output credit, and exactly-one-final-action semantics.
  - After provider-operational-missing, stop calls within the pairing, write one unique terminal missing trace and safe classification, retain every safely completed prior turn, create and credit no action, retain the pairing in every intended denominator, continue only if the prospective circuit breaker has not fired, and never retry, replace, splice, or regenerate the pairing.
  - Freeze the engineering circuit breaker at three consecutive provider-operational-missing pairings for one provider, ten cumulative provider-operational-missing pairings across the 500-pairing campaign, immediate quarantine for any provider-contract-or-safety-failure, and immediate quarantine if a public canary is not protocol-valid; never reset, loosen, or reinterpret it after live results.
  - Use only terminal operational status and sequence for the circuit breaker; inspect no performance, action, target, architecture, family, or scientific outcome.
  - Retain protocol-valid exact metrics; retain policy-v2 metric-specific feasible intervals for protocol-invalid pairings; retain provider-operational-missing pairings in every denominator with registered metric-specific supports or comparator bounds and no invented latent point estimate.
  - Record calls, tokens, cost, retry count, completion status, and an exact provider-response-completion or missingness metric as operational quantities; do not count provider missingness as an invalid submitted action or label missing protocol compliance pass/fail when the status is nonapplicable.
  - Require architecture-contrast bounds over all intended eligible pairings and exact independent reconstruction of endpoints and denominators; valid-output-only and completed-response-only estimates are secondary selection-conditioned diagnostics, and no complete-case unconditional effect, ranking, composite, or leaderboard is permitted.
  - Permit engineering completion only when both canaries pass, fresh custody passes, all 500 pairings have exactly one protocol-valid, protocol-invalid, or provider-operational-missing terminal status, no contract/safety failure or circuit-breaker trigger occurs, all identities and correspondences pass, contamination is zero, caps hold, provider closure precedes lock, no call follows lock, commitments pass, unseal follows verified lock, Methods A/B agree where exact metrics exist, Method C classifies every completed response, missingness and bounds independently agree, and corruption, redaction, and retained-state checks pass.
  - Do not quarantine solely for isolated protocol-invalid or provider-operational-missing outcomes; quarantine for canary failure, contract/safety failure, circuit-breaker trigger, missing/duplicate terminal classification, correspondence/integrity failure, contamination, cap or execution identity breach, lock/unseal-order failure, method/classifier/bound disagreement, corruption acceptance, redaction failure, or unsafe retained state.
  - Freeze campaign treasurebench-agents-v1-repair-confirmation-v5 and batch tb-agents-v1-repair-confirmation-v5-b01 after collision checks; allocate every real seed, task, answer, key, nonce, ciphertext, commitment, log, ledger, response, trace, classification, bound, custody, lock, derived commitment, and audit identity wholly fresh only after authorization.
  - Freeze 50 private tasks, ten from each registered family, five registered architectures, direct OpenAI gpt-5.4-2026-03-05, direct Anthropic claude-sonnet-4-6, one repeat, 500 intended pairings, the exact passing provider-specific schemas, and 256 output tokens per request unless a prospectively justified official-contract change is fixed before execution freeze.
  - Preserve the v4 prompts, action contract, provider schemas, and protocol-validity policy v2 unchanged except where policy-v3 integration strictly requires terminal-status and missing-trace behavior.
  - Prohibit aliases, fallback, OpenRouter, batch routes, regional substitution, provider-managed tools, local models, and substitute providers, models, or routes.
  - Freeze USD 11.51 expected subject to exact v5 graph reproduction, USD 15 conservative, USD 25 total hard cap, USD 10 OpenAI cap, USD 15 Anthropic cap, 5200 maximum calls, and 256 output tokens per request; no ceiling may increase.
  - One later exact generic owner authorization conditionally covers the normal engineering-complete or honest-quarantine path through revalidation, provider audit, canaries, fresh custody and commitment, private prefix, complete matrix unless a hard stop fires, provider closure, output lock and commitment, post-lock replay/unseal, terminal classifications, Methods A/B/C, independent provider-outcome verification, metric intervals and independent all-pairing bounds, safety and corruption checks, deterministic public-safe closeout, validation, PR readiness and squash merge, CI and Pages, live routes, issue closure, synchronized main, and one final schema-valid handoff.
