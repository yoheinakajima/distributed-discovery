expected_outcomes:
  - A current-provider, wholly fresh, repaired 50-task and 500-run sealed engineering pilot execution surface with exact two-credential ingress.
  - Passing provider-schema, action-budget, custody, trace, output-lock, independent-verification, contamination, redaction, budget, complete synthetic-rehearsal, and long-session control-flow acceptance.
  - One deterministic success closeout or one deterministic quarantined closeout, both public-safe and carried through normal repository lifecycle under the same later R2 authorization.
  - A committed exact R2 generic owner-gate manifest and schema-valid owner-gate-required handoff before consequential action.
stop_conditions:
  - Stop before reading .env.txt or any prior private campaign state, creating the real seed or custody, making a provider call, or spending money without the exact active R2 owner authorization.
  - Stop if authorization validity is uncertain or any execution-sensitive code, campaign, batch, model, route, cap, or private identity must change after R2 authorization.
  - Stop if retained private state cannot be safely preserved and locked, or if a replacement task, replacement batch, semantic retry, record splice, or new private identity is proposed.
  - Quarantine rather than stop for any registered canary, custody, prefix, fixed-batch, cap, provider, protocol, final-cardinality, pairing, Method A/B, Method C, metric-range, contamination, output-lock, commitment, or identity failure when safe administrative closeout remains possible.
  - Stop if scientific, paper, private-publication, ranking, release, submission, or base-campaign authority would need to expand.
  - Stop if scientific inventories, claim/run/paper/release state, immutable AO history, either quarantined campaign, or unrelated preservation files change outside the exact public-safe closeout scope.
