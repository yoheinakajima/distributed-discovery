    - Execute the fresh v2 staged campaign only after the exact R2 gate, with public custody and output-lock commitments committed and pushed before dependent private stages.
    - On success, independently verify Methods A, B, and C, metric ranges, pairings, contamination, corruptions, cost, private state, output lock, and redaction before public-safe closeout.
    - On a registered failure, stop calls immediately, preserve append-only encrypted state, close the provider phase, lock safely lockable objects, minimally unseal only when safe, and emit a redacted quarantine closeout.
    - Reconcile only public-safe DD-010, TreasureBench Agents, current-state, roadmap, program-memory, handoff, status, site, and public JSON records.
    - Run the full validation wall, update PR #201 accurately, mark ready and squash-merge only after required checks, verify normal post-merge CI/Pages and named public routes, close issue #200, and synchronize local main.
