owner_decisions:
  - AO-0006 continues in the same session, issue, branch, ExecPlan, draft pull request, campaign, and batch; no replacement task or private identity is created.
  - The unused AOG-AO-0006-FRESH-PILOT-V2 gate and original AO-0006 contract are superseded prospectively and receive no authorization.
  - Live credential ingress uses only repository-root .env.txt through the strict nonexecuting dotenv loader and requests exactly OPENAI_API_KEY and ANTHROPIC_API_KEY.
  - The returned credential set contains only those two names; unrelated credentials are never returned, retained, transmitted, displayed, printed, hashed, fingerprinted, or logged.
  - Selected credentials and adapter secrets are cleared after every provider stage and on success, provider failure, parser or protocol failure, unexpected exception, and final cleanup.
  - The selected pilot design remains 50 wholly new tasks, ten per registered family, five registered architectures, direct OpenAI and direct Anthropic, one repeat, and 500 runs.
  - The campaign, batch, OS-CSPRNG seed, tasks, answers, task and answer keys, nonces, ciphertexts, commitments, access log, ledgers, traces, output lock, and custody are all new.
  - Both quarantined campaigns and every AO-0002 through AO-0005 gate, authorization, ledger, output lock, custody object, and terminal decision remain immutable and receive no authority from this task.
  - AO-0004 R4 provider-specific OpenAI and Anthropic schema conformance and provider-independent exactly-one-final-action conformance remain engineering-only prerequisites.
  - One R2 owner authorization conditionally covers the staged provider campaign and either successful or honest quarantined public-safe administrative closeout through passing checks, squash merge, normal CI and Pages, named live-route verification, issue closure, and synchronized main.
  - A registered prospective acceptance failure is a batch outcome; it stops provider calls and enters deterministic quarantine closeout without replacement, splicing, rescoring, or routine owner interruption.
  - The expected cost remains USD 11.51, conservative planning cost USD 15, and unchanged owner ceilings USD 25 total, USD 10 OpenAI, USD 15 Anthropic, and 5,200 calls.
