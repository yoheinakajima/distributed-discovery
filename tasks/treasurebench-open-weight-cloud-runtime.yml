owner_decisions:
  - Physical ownership of the GPU is not scientifically necessary for this feasibility gate; physical locality and infrastructure-provider independence remain separate properties that are not supplied by rented cloud compute.
  - A qualifying candidate is called an open-weight, self-operated cloud runtime, never local, and must give the owner control of the exact weight artifact, tokenizer, inference engine, container, configuration, prompts, sampling, retention boundary, and authenticated endpoint.
  - RunPod Secure Cloud dedicated Pod with one NVIDIA A100 80GB, official BF16 weights for the exact registered Mistral Small 3.1 24B Instruct revision, pinned vLLM under Mistral's official serving guidance, and a repository-controlled OpenAI-compatible adapter is the primary candidate unless current official evidence proves a fatal incompatibility.
  - The exact BF16 single-A100-80GB identity fails closed if infeasible; quantization, sharding, another model, another GPU class, two GPUs, or a managed endpoint is a separate prospective identity and gate.
  - OpenRouter, Mistral hosted API, FlyMyAI hosted inference, other routed APIs, and managed model endpoints cannot satisfy the self-operated condition unless the owner controls and verifies the actual weight artifact and serving stack.
  - A managed custom-container product qualifies only when the exact container, weights, and configuration can be independently reproduced and the platform performs no hidden model substitution, prompt transformation, semantic retry, or fallback.
  - Authorization-free work may use public official-source network observations and synthetic public fixtures only; it may not read credentials, call RunPod or Hugging Face authenticated APIs, provision compute, download model weights, launch an endpoint, run the calibration, or spend.
  - A later exact generic owner gate may authorize at most one public-only calibration with ten public tasks, five architectures, one repeat, 50 intended pairings, one A100 80GB Pod, six GPU-hours, 400 inference calls, and USD 20 total spend.
  - The calibration creates only public operational engineering measurements and conformance counts; it cannot publish task, family, architecture, or model performance.
  - AO-0011 v5 and every earlier campaign, authorization, ledger, output lock, retained root, private object, and terminal decision remain immutable, closed, unread, unsealed, and unauthorized for reuse.
  - This task does not allocate DD-023, register or execute a scientific run, create or promote a claim, create private tasks or holdouts, alter the 200-task base allocation, weaken the third-model requirement, call a model-provider API, publish a performance comparison, change a paper, or create a release or submission.
