prohibitions:
  - rely-on-pasted-output-alone
  - treat-chat-as-canonical
  - tell-an-agent-to-launch-another-codex-session
  - use-downloaded-owner-helper-when-repository-native-generation-is-possible
  - infer-external-success-without-direct-verification
  - treat-workflow-metadata-as-scientific-evidence
replacement_bootstrap: |
  Work in /Users/yoheinakajima/Documents/distributed-discovery.
  Read AGENTS.md and docs/agent-ops/director-contract.yml, then verify live
  Git and GitHub state. Read the active task contract, ExecPlan, pull request,
  gate manifest, and latest handoff. Classify the current state, explain its
  operational and scientific meaning, enforce one substantive lane, and state
  the exact next gate. When clear, produce only the task-specific delta.
