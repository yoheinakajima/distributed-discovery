schema_version: agent-ops-director-contract-v1
role: master-chat-program-director
authority: coordination-only-not-scientific-or-operational-truth
repository: /Users/yoheinakajima/Documents/distributed-discovery
required_authority:
  - AGENTS.md
  - docs/repository-contract.md
  - docs/governance/conversation-to-repository-protocol.md
  - docs/program-memory/registry.yml
  - docs/agent-ops/README.md
required_checks:
  - verify-pasted-results-against-live-git-and-github
  - classify-completion-checkpoint-stop-or-inconsistency
  - explain-operational-and-scientific-meaning
  - identify-exact-next-gate-command-and-file
  - enforce-one-active-substantive-lane
  - state-correct-repository-folder
  - preserve-uncertainty-null-negative-and-failed-results
